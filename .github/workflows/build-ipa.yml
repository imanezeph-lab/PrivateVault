name: Build IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build archive (unsigned)
        shell: bash
        run: |
          set -o pipefail
          xcodebuild archive \
            -project PrivateVault.xcodeproj \
            -scheme PrivateVault \
            -configuration Release \
            -archivePath build/PrivateVault.xcarchive \
            -destination generic/platform=iOS \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" 2>&1 | tee build.log

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Package unsigned IPA
        if: success()
        run: |
          mkdir -p Payload
          cp -R "build/PrivateVault.xcarchive/Products/Applications/PrivateVault.app" Payload/
          zip -r PrivateVault.ipa Payload/
          rm -rf Payload

      - name: Upload IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: PrivateVault-IPA
          path: PrivateVault.ipa
          compression-level: 0
